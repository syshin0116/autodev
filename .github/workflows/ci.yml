name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record the toolchain
        run: |
          cargo --version
          rustc --version
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      # A hand-edited lock workflow would run something the reviewed source
      # does not describe, so recompiling must reproduce it exactly.
      - name: Reject agentic workflow drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install githubnext/gh-aw --pin v0.86.2
          gh aw compile --strict
          git diff --exit-code -- .github/workflows .github/aw
      # The rootless project revision reads only repos/{owner}/{repo}, so this
      # step needs a read-only GitHub token for the gh CLI and nothing else.
      - name: Validate the approved planning revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked --quiet -- .
