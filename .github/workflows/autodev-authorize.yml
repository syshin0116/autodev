name: Autodev authorize

# Trusted controller for one ready event. It runs from the default branch and
# decides authorization; it never runs an engine and never writes code. The
# operator's local runner claims the recorded episode. Every event value
# reaches the shell through the environment so issue content cannot become
# script.

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: autodev-episode-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REPOSITORY: ${{ github.repository }}
  REPOSITORY_ID: ${{ github.event.repository.id }}
  RUN_ID: ${{ github.run_id }}
  ISSUE: ${{ github.event.issue.number }}
  ISSUE_ID: ${{ github.event.issue.id }}
  ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
  AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association }}
  LABEL: ${{ github.event.label.name }}
  ACTOR: ${{ github.event.sender.login }}
  ACTOR_ID: ${{ github.event.sender.id }}

jobs:
  authorize:
    name: authorize
    if: github.event.label.name == 'autodev:ready'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the authorizing actor role
        id: actor
        run: |
          set -euo pipefail
          role=$(gh api "repos/$REPOSITORY/collaborators/$ACTOR/permission" --jq '.role_name // .permission')
          echo "role=$role" >> "$GITHUB_OUTPUT"

      - name: Read the approved task snapshot
        run: |
          set -euo pipefail
          cargo run --locked --quiet -- --print-task-snapshot --root . --issue "$ISSUE" > snapshot.json

      # A body from outside the trusted associations is withheld rather than
      # filtered in place, so untrusted text never reaches the engine.
      - name: Build the integrity-filtered agent input
        run: |
          set -euo pipefail
          scripts/autodev-agent-input.sh snapshot.json "$AUTHOR_ASSOCIATION" > agent-input.md

      - name: Build the ready event
        run: |
          set -euo pipefail
          jq -n \
            --argjson repository_id "$REPOSITORY_ID" \
            --argjson run_id "$RUN_ID" \
            --argjson issue_id "$ISSUE_ID" \
            --arg issue_node_id "$ISSUE_NODE_ID" \
            --argjson issue_number "$ISSUE" \
            --arg label "$LABEL" \
            --argjson actor_id "$ACTOR_ID" \
            --arg actor "$ACTOR" \
            --arg actor_role "${{ steps.actor.outputs.role }}" \
            --slurpfile snapshot snapshot.json \
            '{
              repository_id: $repository_id,
              run_id: $run_id,
              issue_id: $issue_id,
              issue_node_id: $issue_node_id,
              issue_number: $issue_number,
              label: $label,
              actor_id: $actor_id,
              actor: $actor,
              actor_role: $actor_role,
              task_sha256: $snapshot[0].task_snapshot.sha256,
              project_revision_sha256: $snapshot[0].project_revision.sha256
            }' > ready-event.json

      - name: Read the durable authorization record
        id: prior
        run: |
          set -euo pipefail
          scripts/autodev-episode-record.sh "$REPOSITORY" "$ISSUE" > record.json
          jq -r '.authorizations' record.json > prior.json
          echo "comment_id=$(jq -r '.comment_id // ""' record.json)" >> "$GITHUB_OUTPUT"

      - name: Decide the authorization
        id: decide
        run: |
          set -euo pipefail
          cargo run --locked --quiet -- --authorize \
            --root . --issue "$ISSUE" \
            --event ready-event.json \
            --agent-input agent-input.md \
            --prior prior.json > decision.json
          echo "action=$(jq -r '.action' decision.json)" >> "$GITHUB_OUTPUT"
          jq -r '"action=" + .action' decision.json

      # Persisting the record before any side effect is what turns a duplicate
      # run into a no-op instead of a second episode.
      - name: Persist the authorization record
        run: |
          set -euo pipefail
          jq -s '.[0] + [.[1].authorization]
                 | group_by(.episode.authorization_generation)
                 | map(last)' prior.json decision.json > next.json
          scripts/autodev-record-write.sh "$REPOSITORY" "$ISSUE" \
            "${{ steps.prior.outputs.comment_id }}" next.json

      # A superseded episode whose cleanup already finished can start its
      # replacement immediately: the replacement digests are recorded above, so
      # the second decision is the one that opens generation two.
      - name: Start the replacement of a superseded episode
        id: replacement
        if: steps.decide.outputs.action == 'supersession_required'
        run: |
          set -euo pipefail
          if [ "$(jq -r '.authorization.cleanup_complete' decision.json)" != "true" ]; then
            echo "::notice::the superseded episode still needs cleanup"
            exit 0
          fi
          jq -s '.[0] + [.[1].authorization]
                 | group_by(.episode.authorization_generation)
                 | map(last)' prior.json decision.json > superseded.json
          cargo run --locked --quiet -- --authorize \
            --root . --issue "$ISSUE" \
            --event ready-event.json \
            --agent-input agent-input.md \
            --prior superseded.json > decision.json
          cp superseded.json prior.json
          jq -r '"action=" + .action' decision.json

      # Delivery is not started here. The operator's runner claims the recorded
      # episode, so this step only reports whether the episode is claimable.
      - name: Report the decision
        run: |
          set -euo pipefail
          action=$(jq -r '.action' decision.json)
          if [ "$action" = "supersession_required" ]; then
            echo "::error::the previous episode must finish cleanup before this task can restart"
            exit 1
          fi
          if [ "$action" != "start" ] && [ "$action" != "replay" ]; then
            gh issue edit "$ISSUE" --repo "$REPOSITORY" --add-label "autodev:human-needed"
            echo "::error::authorization returned $action, which requires human judgment"
            exit 1
          fi
          {
            echo "Episode $(jq -r '.authorization.episode.authorization_generation' decision.json) is authorized for issue #$ISSUE."
            echo "Run scripts/autodev-deliver.sh --issue $ISSUE locally to deliver it."
          } >> "$GITHUB_STEP_SUMMARY"
